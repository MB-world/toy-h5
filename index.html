<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡 3D 玩具概念展廳</title>
  
  <!-- 載入 Google 官方的 3D 模型播放器元件 (維持完全可用的 4.3.1 版本) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  
  <style>
    /* 全域重置與基礎樣式 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      color: #fff;
    }

    /* 展廳場景切換核心邏輯 */
    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 1;
      z-index: 10;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 🌟 第一階段：歡迎封面 */
    #scene-welcome {
      background: #000;
      z-index: 100;
    }

    .start-title {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-align: center;
    }

    .start-btn {
      padding: 15px 40px;
      background: none;
      border: 2px solid #fff;
      color: #fff;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 2px;
    }

    /* 🧭 第三階段：命運抉擇頁 */
    #scene-choice {
      background: url('choice_bg.jpg') center/cover no-repeat;
    }

    .choice-title {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-top: -30%;
    }

    .btn-group {
      display: flex;
      gap: 30px;
      margin-top: 80%;
      width: 80%;
    }

    .btn {
      flex: 1;
      padding: 15px 0;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    /* 🕹️ 第四階段：3D 互動頁 */
    #scene-3d {
      background: #0a0a0a;
    }

    model-viewer {
      width: 100%;
      height: 68%;
    }

    /* 底部控制面板，留空間給雙按鈕 */
    .control-panel {
      width: 100%;
      height: 32%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* 手動玩具動態開關按鈕樣式 */
    .toy-anim-btn {
      width: 70%;
      padding: 12px 0;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      font-size: 15px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toy-anim-btn.playing {
      background: #00ff88;
      color: #000;
      border-color: #00ff88;
      font-weight: bold;
    }

    /* 結局大片按鈕 */
    .switch-btn {
      width: 70%;
      padding: 15px 0;
      background: #fff;
      border: none;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,255,255,0.2);
    }

    .back-btn {
      font-size: 14px;
      color: #888;
      cursor: pointer;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- 🌟 第一階段：點擊進入封面 -->
  <div id="scene-welcome" class="scene active">
    <h2 class="start-title">歡迎來到守護獸展廳</h2>
    <button class="start-btn" onclick="startExperience()">點擊開啟故事</button>
  </div>

  <!-- ⏳ 第二階段：前導故事影片 -->
  <div id="scene-intro" class="scene">
    <video id="intro-video" src="intro.mp4" playsinline muted></video>
  </div>

  <!-- 🧭 第三階段：命運抉擇頁 -->
  <div id="scene-choice" class="scene">
    <h1 class="choice-title">請選擇你的守護獸</h1>
    <div class="btn-group">
      <button class="btn" onclick="enter3D('tiger')">虎玩具</button>
      <button class="btn" onclick="enter3D('snake')">蛇玩具</button>
    </div>
  </div>

  <!-- 🕹️ 第四階段：3D 旋轉互動 -->
  <div id="scene-3d" class="scene">
    <model-viewer id="toy-viewer" camera-controls interpolation-decay="200" shadow-intensity="1"></model-viewer>
    
    <div class="control-panel">
      <!-- 🎮 手動控制 3D 機械動態的獨立按鈕 -->
      <button id="anim-toggle-btn" class="toy-anim-btn" onclick="toggleToyAnimation()">檢查玩具運作動態:關閉中</button>
      <button class="switch-btn" onclick="triggerOutro()">啟動產品故事大結局</button>
      <div class="back-btn" onclick="goBackToChoice()">⬅ 返回重新選擇</div>
    </div>
  </div>

  <!-- 🎬 第五階段：結局特效影片 -->
  <div id="scene-outro" class="scene">
    <video id="outro-video" src="" playsinline muted></video>
  </div>

  <script>
    const introVid = document.getElementById('intro-video');
    const outroVid = document.getElementById('outro-video');
    const viewer = document.getElementById('toy-viewer');
    const animBtn = document.getElementById('anim-toggle-btn');
    
    let currentSelection = ''; // 儲存當前玩家選擇的老虎或蛇
    let isToyMoving = false;    // 追蹤模型內動畫狀態

    // 【封面階段】點擊開始體驗，進入前導故事影片
    function startExperience() {
      switchScene('scene-welcome', 'scene-intro');
      introVid.play();
    }

    // 前導故事影片播放結束，自動進入抉擇頁面
    introVid.onended = function() {
      switchScene('scene-intro', 'scene-choice');
    };

    // 點擊前導影片本身也可以直接跳過，進抉擇頁
    introVid.onclick = function() {
      introVid.pause();
      switchScene('scene-intro', 'scene-choice');
    };

    // 【抉擇階段】玩家選好角色後，動態給予 3D 模型路徑並切換場景
    function enter3D(type) {
      currentSelection = type;
      viewer.src = type === 'tiger' ? 'tiger.glb' : 'snake.glb';
      
      // 每次重新選擇進入 3D 頁面時，重置按鈕狀態為靜態關閉
      isToyMoving = false;
      animBtn.innerText = "檢查玩具運作動態:關閉中";
      animBtn.classList.remove('playing');
      
      switchScene('scene-choice', 'scene-3d');
    }

    // 【3D 互動階段】🎮 控制 3D 模型自帶動畫動作的開關邏輯
    function toggleToyAnimation() {
      if (!isToyMoving) {
        viewer.play(); // 讓 3D 模型動起來
        animBtn.innerText = "檢查玩具運作動態:運作中 🟢";
        animBtn.classList.add('playing');
        isToyMoving = true;
      } else {
        viewer.pause(); // 暫停 3D 模型動作
        animBtn.innerText = "檢查玩具運作動態:關閉中";
        animBtn.classList.remove('playing');
        isToyMoving = false;
      }
    }

    // 【大結局階段】點擊啟動結局大片
    function triggerOutro() {
      viewer.pause(); // 播最後大片前，先停掉背景的 3D 減少耗能
      outroVid.src = currentSelection === 'tiger' ? 'tiger_outro.mp4' : 'snake_outro.mp4';
      switchScene('scene-3d', 'scene-outro');
      outroVid.play();
    }

    // 結局大片播完後，重回命運抉擇頁面
    outroVid.onended = function() {
      switchScene('scene-outro', 'scene-choice');
    };

    // 【返回功能】點擊返回重新選擇，清空 3D 資源並切回抉擇頁
    function goBackToChoice() {
      viewer.src = '';
      switchScene('scene-3d', 'scene-choice');
    }

    // 【核心函式】控制場景淡入淡出切換
    function switchScene(hideId, showId) {
      const hideScene = document.getElementById(hideId);
      const showScene = document.getElementById(showId);
      
      hideScene.style.opacity = '0';
      
      setTimeout(() => {
        hideScene.classList.remove('active');
        showScene.classList.add('active');
        
        setTimeout(() => {
          showScene.style.opacity = '1';
        }, 50);
      }, 400);
    }
  </script>
</body>
</html>
