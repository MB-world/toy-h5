<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極簡 3D 玩具概念展廳</title>
  
  <!-- 載入 Google 官方的 3D 模型播放器元件 (維持 4.3.1 版本) -->
  <script type="module" src="https://googleapis.com"></script>
  
  <style>
    /* ==========================================================================
       1. 全域重置與基礎樣式
       ========================================================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      color: #fff;
    }

    /* 展廳場景切換核心樣式 */
    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .active {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 1;
      z-index: 10;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ==========================================================================
       2. 各別場景與按鈕樣式
       ========================================================================== */
    /* 🌟 第一階段：歡迎封面 */
    #scene-welcome {
      background: #000;
      z-index: 100;
    }

    .start-title {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 4px;
      margin-bottom: 20px;
      text-align: center;
    }

    .start-btn {
      padding: 15px 40px;
      background: none;
      border: 2px solid #fff;
      color: #fff;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      letter-spacing: 2px;
    }

    /* 🧭 第三階段：命運抉擇頁 */
    #scene-choice {
      background: url('choice_bg.jpg') center/cover no-repeat;
    }

    .choice-title {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-top: -30%;
    }

    .btn-group {
      display: flex;
      gap: 30px;
      margin-top: 80%;
      width: 80%;
    }

    .btn {
      flex: 1;
      padding: 15px 0;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      text-align: center;
    }

    /* 🕹️ 第四階段：3D 互動頁 */
    #scene-3d {
      background: #0a0a0a;
    }

    /* 用於動態塞入 3D 播放器的容器，確保高度固定為 68% */
    #viewer-container {
      width: 100%;
      height: 68%;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* 底部按鈕控制面板 */
    .control-panel {
      width: 100%;
      height: 32%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* 手動玩具動態開關按鈕 */
    .toy-anim-btn {
      width: 70%;
      padding: 12px 0;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.5);
      color: #fff;
      font-size: 15px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toy-anim-btn.playing {
      background: #00ff88;
      color: #000;
      border-color: #00ff88;
      font-weight: bold;
    }

    /* 結局大片按鈕 */
    .switch-btn {
      width: 70%;
      padding: 15px 0;
      background: #fff;
      border: none;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255,255,255,0.2);
    }

    .back-btn {
      font-size: 14px;
      color: #888;
      cursor: pointer;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- 🌟 第一階段：點擊進入封面 -->
  <div id="scene-welcome" class="scene active">
    <h2 class="start-title">歡迎來到守護獸展廳</h2>
    <button class="start-btn" onclick="startExperience()">點擊開啟故事</button>
  </div>

  <!-- ⏳ 第二階段：前導故事影片 -->
  <div id="scene-intro" class="scene">
    <video id="intro-video" src="intro.mp4" playsinline muted></video>
  </div>

  <!-- 🧭 第三階段：命運抉擇頁 -->
  <div id="scene-choice" class="scene">
    <h1 class="choice-title">請選擇你的守護獸</h1>
    <div class="btn-group">
      <button class="btn" onclick="enter3D('tiger')">虎玩具</button>
      <button class="btn" onclick="enter3D('snake')">蛇玩具</button>
    </div>
  </div>

  <!-- 🕹️ 第四階段：3D 旋轉互動頁面 -->
  <div id="scene-3d" class="scene">
    <!-- 🛠️ 關鍵修改：改用空白容器，等切換過來後才動態現場建立 3D 標籤，防止畫布尺寸被瀏覽器壓毀 -->
    <div id="viewer-container"></div>
    
    <div class="control-panel">
      <!-- 🎮 手動控制 3D 機械動態的獨立按鈕 -->
      <button id="anim-toggle-btn" class="toy-anim-btn" onclick="toggleToyAnimation()">檢查玩具運作動態:關閉中</button>
      <button class="switch-btn" onclick="triggerOutro()">啟動產品故事大結局</button>
      <div class="back-btn" onclick="goBackToChoice()">⬅ 返回重新選擇</div>
    </div>
  </div>

  <!-- 🎬 第五階段：結局特效影片 -->
  <div id="scene-outro" class="scene">
    <video id="outro-video" src="" playsinline muted></video>
  </div>

  <!-- ==========================================================================
     3. JavaScript 互動邏輯
     ========================================================================== -->
  <script>
    const introVid = document.getElementById('intro-video');
    const outroVid = document.getElementById('outro-video');
    const container = document.getElementById('viewer-container');
    const animBtn = document.getElementById('anim-toggle-btn');
    
    let viewer = null;         // 用來動態存放 3D model-viewer 的變數
    let currentSelection = ''; // 紀錄目前選了老虎還是蛇
    let isToyMoving = false;    // 追蹤模型內動畫狀態

    // 【封面階段】點擊開始，進入前導故事影片
    function startExperience() {
      switchScene('scene-welcome', 'scene-intro');
      introVid.play();
    }

    // 前導影片播放完畢，自動跳抉擇頁
    introVid.onended = function() {
      switchScene('scene-intro', 'scene-choice');
    };

    // 點擊前導影片，可直接跳過影片進抉擇頁
    introVid.onclick = function() {
      introVid.pause();
      switchScene('scene-intro', 'scene-choice');
    };

    // 【抉擇階段】點擊按鈕，現場初始化並建立全新的 3D 播放器
    function enter3D(type) {
      currentSelection = type;
      
      // 每次點進來時，都先清空之前的舊容器，徹底釋放舊有的 WebGL 記憶體
      container.innerHTML = '';
      
      // 🛠️ 核心修正：現場建立全新的 model-viewer 標籤，確保生成時寬高為正確的 100%
      const modelSrc = type === 'tiger' ? 'tiger.glb' : 'snake.glb';
      container.innerHTML = `
        <model-viewer 
          id="toy-viewer" 
          src="${modelSrc}" 
          camera-controls 
          interpolation-decay="200" 
          shadow-intensity="1" 
          loading="eager">
        </model-viewer>
      `;
      
      // 重新綁定新生成的 3D 元件變數
      viewer = document.getElementById('toy-viewer');
      
      // 重置動畫按鈕狀態為靜態關閉
      isToyMoving = false;
      animBtn.innerText = "檢查玩具運作動態:關閉中";
      animBtn.classList.remove('playing');
      
      // 切換進入 3D 場景
      switchScene('scene-choice', 'scene-3d');
    }

    // 【3D 互動階段】🎮 手動控制 3D 模型內部機械動作的開關
    function toggleToyAnimation() {
      if (!viewer) return;
      if (!isToyMoving) {
        viewer.play(); // 讓 3D 模型動起來
        animBtn.innerText = "檢查玩具運作動態:運作中 🟢";
        animBtn.classList.add('playing');
        isToyMoving = true;
      } else {
        viewer.pause(); // 暫停 3D 模型動作
        animBtn.innerText = "檢查玩具運作動態:關閉中";
        animBtn.classList.remove('playing');
        isToyMoving = false;
      }
    }

    // 【大結局階段】點擊啟動大結局特效影片
    function triggerOutro() {
      if (viewer) viewer.pause(); // 播放結局大片前先停掉背景的 3D 模型
      outroVid.src = currentSelection === 'tiger' ? 'tiger_outro.mp4' : 'snake_outro.mp4';
      switchScene('scene-3d', 'scene-outro');
      outroVid.play();
    }

    // 結局大片播完後，重回命運抉擇頁面
    outroVid.onended = function() {
      switchScene('scene-outro', 'scene-choice');
    };

    // 【返回功能】點擊返回按鈕，清空 3D 標籤並回抉擇頁
    function goBackToChoice() {
      container.innerHTML = ''; // 徹底清空 DOM，防止瀏覽器背景維持渲染導致下次卡死
      viewer = null;
      switchScene('scene-3d', 'scene-choice');
    }

    // 【核心函式】控制場景淡入淡出切換
    function switchScene(hideId, showId) {
      const hideScene = document.getElementById(hideId);
      const showScene = document.getElementById(showId);
      
      hideScene.style.opacity = '0';
      
      setTimeout(() => {
        hideScene.classList.remove('active');
        showScene.classList.add('active');
        
        setTimeout(() => {
          showScene.style.opacity = '1';
        }, 50);
      }, 400);
    }
  </script>
</body>
</html>
