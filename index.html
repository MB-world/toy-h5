<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 極速測試頁</title>
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
        .container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        model-viewer { width: 100%; height: 75%; background: #000; }
        .btn-zone { width: 100%; height: 25%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        button { padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 25px; border: none; cursor: pointer; }
        #anim-btn { background: #00ff88; color: #000; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 這裡預設直接強制載入 tiger.glb，跳過所有影片 -->
        <model-viewer id="test-viewer" src="tiger.glb" camera-controls shadow-intensity="1"></model-viewer>
        
        <div class="btn-zone">
            <button id="anim-btn" onclick="toggleAnim()">點擊開關玩具動態</button>
            <p style="font-size: 12px; color: #888;">如果畫面上方一片漆黑，代表 tiger.glb 檔案路徑或檔名有誤</p>
        </div>
    </div>

    <script>
        const viewer = document.getElementById('test-viewer');
        let isMoving = false;
        function toggleAnim() {
            if (!isMoving) {
                viewer.play();
                document.getElementById('anim-btn').innerText = "動態運作中 🟢 (此時仍可手指旋轉)";
                isMoving = true;
            } else {
                viewer.pause();
                document.getElementById('anim-btn').innerText = "點擊開關玩具動態";
                isMoving = false;
            }
        }
    </script>
</body>
</html>
